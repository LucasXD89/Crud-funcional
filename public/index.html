<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Inventario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>📦 Sistema de Inventario</h1>

<div class="formulario">
    <input type="hidden" id="id">
    <input type="text" id="nombre" placeholder="Nombre">
    <input type="number" id="precio" placeholder="Precio">
    <input type="number" id="stock" placeholder="Stock">
    <button onclick="guardarProducto()">Agregar</button>
    <button onclick="limpiar()">🗑️ Limpiar</button>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="tabla"></tbody>
</table>

<footer>
    <div class="footer-content">
        <p><strong>📦 Sistema de Inventario</strong></p>
        <p>Desarrollado por: <em>Jorge Borda</em>, <em>Yamile Paredes</em>, <em>Lucas Santos</em></p>
        <p>&copy; 2026 - Todos los derechos reservados</p>
    </div>
</footer>

<script src="script.js"></script>

</body>
</html>
